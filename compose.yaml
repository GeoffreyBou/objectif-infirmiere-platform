# Développement local uniquement. Aucun déploiement Docker OVH requis.
services:
  db:
    image: mariadb:11.4@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    environment:
      MARIADB_DATABASE: oi
      MARIADB_USER: oi
      MARIADB_PASSWORD: ${OI_LOCAL_DB_PASSWORD:?Run scripts/setup.sh}
      MARIADB_ROOT_PASSWORD: ${OI_LOCAL_ROOT_PASSWORD:?Run scripts/setup.sh}
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 40
  wordpress:
    image: wordpress:6.8.3-php8.3-apache@sha256:30bff39330d1693b0ce13d32fc9b7bb67193064f040b7d60d3494e136fa599d4
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      db: {condition: service_healthy}
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: oi
      WORDPRESS_DB_PASSWORD: ${OI_LOCAL_DB_PASSWORD}
      WORDPRESS_DB_NAME: oi
      WORDPRESS_DEBUG: 1
      OI_STRIPE_SECRET_KEY: ${OI_STRIPE_SECRET_KEY:-}
      OI_STRIPE_WEBHOOK_SECRET: ${OI_STRIPE_WEBHOOK_SECRET:-}
      OI_OPENAI_API_KEY: ${OI_OPENAI_API_KEY:-}
    volumes:
      - wp:/var/www/html
      - ./plugin/objectif-infirmiere:/var/www/html/wp-content/plugins/objectif-infirmiere:ro
  cli:
    image: wordpress:cli-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    user: "33:33"
    environment: *wp-env
    volumes:
      - wp:/var/www/html
      - ./plugin/objectif-infirmiere:/var/www/html/wp-content/plugins/objectif-infirmiere:ro
      - ./tests:/tests:ro
      - ./scripts:/oi-scripts:ro
    profiles: [tools]
volumes:
  db:
  wp:
