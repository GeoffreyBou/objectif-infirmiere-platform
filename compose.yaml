# Développement local uniquement. Aucun déploiement Docker OVH requis.
services:
  db:
    image: mariadb:11.4@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    environment:
      MARIADB_DATABASE: oi
      MARIADB_USER: oi
      MARIADB_PASSWORD: ${OI_LOCAL_DB_PASSWORD:?Run scripts/setup.sh}
      MARIADB_ROOT_PASSWORD: ${OI_LOCAL_ROOT_PASSWORD:?Run scripts/setup.sh}
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 40
  wordpress:
    image: wordpress:7.1.2-php8.3-apache@sha256:d8987130fa95e2790668e20cc532603362b0bc95729310bfaf6ab7f12b35dc93
    ports: ["127.0.0.1:8080:80"]
    extra_hosts: ["${OI_PROXY_HOST:-oi-proxy-unused}:${OI_PROXY_IP:-127.0.0.1}"]
    depends_on:
      db: {condition: service_healthy}
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: oi
      WORDPRESS_DB_PASSWORD: ${OI_LOCAL_DB_PASSWORD}
      WORDPRESS_DB_NAME: oi
      WORDPRESS_DEBUG: 1
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      WORDPRESS_CONFIG_EXTRA: |
        $$oi_proxy = parse_url(getenv('HTTPS_PROXY') ?: getenv('HTTP_PROXY'));
        if (is_array($$oi_proxy) && !empty($$oi_proxy['host'])) {
          define('WP_PROXY_HOST', $$oi_proxy['host']);
          define('WP_PROXY_PORT', $$oi_proxy['port'] ?? 8080);
          define('WP_PROXY_BYPASS_HOSTS', 'localhost,127.0.0.1,db');
          if (!empty($$oi_proxy['user'])) define('WP_PROXY_USERNAME', urldecode($$oi_proxy['user']));
          if (!empty($$oi_proxy['pass'])) define('WP_PROXY_PASSWORD', urldecode($$oi_proxy['pass']));
        }
        unset($$oi_proxy);
      OI_STRIPE_SECRET_KEY: ${OI_STRIPE_SECRET_KEY:-}
      OI_STRIPE_WEBHOOK_SECRET: ${OI_STRIPE_WEBHOOK_SECRET:-}
      OI_OPENAI_API_KEY: ${OI_OPENAI_API_KEY:-}
    volumes:
      - wp:/var/www/html
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ./.runtime/cloud-trust.php:/var/www/html/wp-content/mu-plugins/oi-cloud-trust.php:ro
      - ./plugin/objectif-infirmiere:/var/www/html/wp-content/plugins/objectif-infirmiere:ro
  cli:
    image: wordpress:cli-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    user: "33:33"
    extra_hosts: ["${OI_PROXY_HOST:-oi-proxy-unused}:${OI_PROXY_IP:-127.0.0.1}"]
    environment: *wp-env
    volumes:
      - wp:/var/www/html
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ./.runtime/cloud-trust.php:/var/www/html/wp-content/mu-plugins/oi-cloud-trust.php:ro
      - ./plugin/objectif-infirmiere:/var/www/html/wp-content/plugins/objectif-infirmiere:ro
      - ./tests:/tests:ro
      - ./scripts:/oi-scripts:ro
    profiles: [tools]
volumes:
  db:
  wp:
